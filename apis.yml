name: Kiwilogic
description: 'Kiwilogic.com AG was a German conversational-AI pioneer founded in 1999
  in Hamburg, with a secondary office in London. It built the Lingubot platform, one
  of the earliest commercial natural-language dialogue engines for the web, which let
  online businesses deploy interactive virtual characters that acted as store greeter,
  customer-support agent, product specialist and entertainer across web sites and mobile
  messaging channels. The company was backed by Earlybird Venture Capital (approximately
  $5.2M reported) and won a best-German-startup award in 2000. The Lingubot business
  was acquired in the mid-2000s and folded into Artificial Solutions, whose Teneo conversational-AI
  and voice-AI platform is the commercial successor; the kiwilogic.com domain now issues
  a blanket redirect to teneo.ai. Kiwilogic operates no independent developer portal,
  documentation, or API surface today, and this profile is maintained as a historical
  company record within the API Evangelist network rather than as an active API provider.'
